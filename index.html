<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Particle Vision System</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="canvas-container"></div>

    <!-- Right side model selection panel -->
    <div class="control-panel">
        <h2>Particle Models</h2>
        <div class="preset-buttons">
            <button class="preset-btn active" data-model="nebula">Nebula</button>
            <button class="preset-btn" data-model="fireworks">Fireworks</button>
            <button class="preset-btn" data-model="saturn">Saturn</button>
            <button class="preset-btn" data-model="flower">Flower</button>
            <button class="preset-btn" data-model="spiral">Spiral</button>
            <button class="preset-btn" data-model="galaxy">Galaxy</button>
        </div>

        <div class="control-group">
            <label>Particle Color</label>
            <input type="color" id="particle-color" value="#00ffff">
        </div>

        <div class="control-group">
            <label>Particle Density <span id="density-value">5000</span></label>
            <input type="range" id="particle-density" min="1000" max="20000" value="5000" step="500">
        </div>

        <div class="control-group">
            <label>Glow Intensity <span id="glow-value">1.5</span></label>
            <input type="range" id="glow-intensity" min="0.5" max="3" value="1.5" step="0.1">
        </div>

        <div class="control-group">
            <label>Rotation Speed <span id="speed-value">1.0</span></label>
            <input type="range" id="rotation-speed" min="0.1" max="3" value="1" step="0.1">
        </div>
    </div>

    <!-- Bottom left camera window -->
    <div class="camera-window" id="camera-window">
        <div class="camera-header">
            <span>Camera</span>
            <div class="camera-controls">
                <button class="camera-btn" id="camera-resize-btn" title="Resize">
                    <svg viewBox="0 0 24 24" width="16" height="16">
                        <path fill="currentColor" d="M4 4h6v6H4V4zm10 0h6v6h-6V4zM4 14h6v6H4v-6zm10 0h6v6h-6v-6z"/>
                    </svg>
                </button>
                <button class="camera-btn" id="camera-close-btn" title="Close">
                    <svg viewBox="0 0 24 24" width="16" height="16">
                        <path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                    </svg>
                </button>
            </div>
        </div>
        <video id="camera-video" autoplay playsinline></video>
        <div id="hand-status" class="hand-status">Waiting for gesture...</div>
    </div>

    <!-- Bottom right fullscreen button -->
    <button class="fullscreen-btn" id="fullscreen-btn" title="Fullscreen">
        <svg viewBox="0 0 24 24" width="24" height="24">
            <path fill="currentColor" d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
        </svg>
    </button>

    <!-- Loading screen -->
    <div class="loading-screen" id="loading-screen">
        <div class="loader">
            <div class="particle-loader"></div>
            <p>Initializing hand tracking...</p>
        </div>
    </div>

    <!-- MediaPipe Scripts -->
    <script src="https://unpkg.com/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous" onerror="console.error('Failed to load hands.js')"></script>
    <script src="https://unpkg.com/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js" crossorigin="anonymous" onerror="console.error('Failed to load camera_utils.js')"></script>
    <script>
        // Debug: check if MediaPipe loaded
        window.addEventListener('load', () => {
            console.log('Hands available:', typeof window.Hands);
            console.log('Camera available:', typeof window.Camera);
        });
    </script>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
