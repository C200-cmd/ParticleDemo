<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 粒子视觉系统</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="canvas-container"></div>

    <!-- 左侧手势指南侧边栏 -->
    <div class="guide-panel" id="guide-panel">
        <div class="guide-header">
            <h2>手势操作指南</h2>
            <button class="guide-close-btn" id="guide-close-btn" title="收起指南">
                <svg viewBox="0 0 24 24" width="16" height="16">
                    <path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                </svg>
            </button>
        </div>

        <div class="guide-section">
            <h3>手势控制</h3>
            <ul class="gesture-list">
                <li>
                    <span class="gesture-name">张开手掌</span>
                    <span class="gesture-desc">粒子向外扩散</span>
                </li>
                <li>
                    <span class="gesture-name">握紧拳头</span>
                    <span class="gesture-desc">粒子向内收缩</span>
                </li>
                <li>
                    <span class="gesture-name">左右移动手掌</span>
                    <span class="gesture-desc">模型水平旋转</span>
                </li>
                <li>
                    <span class="gesture-name">上下移动手掌</span>
                    <span class="gesture-desc">模型垂直旋转</span>
                </li>
                <li>
                    <span class="gesture-name">比 ✌ 停留半秒</span>
                    <span class="gesture-desc">切换粒子模型</span>
                </li>
                <li>
                    <span class="gesture-name">移开手掌</span>
                    <span class="gesture-desc">模型自动旋转</span>
                </li>
            </ul>
        </div>

        <div class="guide-section">
            <h3>粒子模型</h3>
            <ul class="model-list">
                <li><span class="model-name">星云</span><span class="model-desc">球形雾状粒子云</span></li>
                <li><span class="model-name">烟花</span><span class="model-desc">粒子四散绽放</span></li>
                <li><span class="model-name">土星</span><span class="model-desc">星球与光环</span></li>
                <li><span class="model-name">花朵</span><span class="model-desc">六瓣绽放花形</span></li>
                <li><span class="model-name">螺旋</span><span class="model-desc">旋转上升螺旋</span></li>
                <li><span class="model-name">星系</span><span class="model-desc">三条旋臂星系</span></li>
            </ul>
        </div>

        <div class="guide-tip">提示：摄像头窗口可缩放或关闭，双击窗口区域可重新打开。</div>
    </div>

    <!-- 左上角展开指南按钮 -->
    <button class="guide-toggle-btn" id="guide-toggle-btn" title="展开手势指南">
        <svg viewBox="0 0 24 24" width="18" height="18">
            <path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/>
        </svg>
        <span>手势指南</span>
    </button>

    <!-- Right side model selection panel -->
    <div class="control-panel">
        <h2>粒子模型</h2>
        <div class="preset-buttons">
            <button class="preset-btn active" data-model="nebula">星云</button>
            <button class="preset-btn" data-model="fireworks">烟花</button>
            <button class="preset-btn" data-model="saturn">土星</button>
            <button class="preset-btn" data-model="flower">花朵</button>
            <button class="preset-btn" data-model="spiral">螺旋</button>
            <button class="preset-btn" data-model="galaxy">星系</button>
        </div>

        <div class="control-group">
            <label>粒子颜色</label>
            <input type="color" id="particle-color" value="#00ffff">
        </div>

        <div class="control-group">
            <label>粒子密度 <span id="density-value">5000</span></label>
            <input type="range" id="particle-density" min="1000" max="20000" value="5000" step="500">
        </div>

        <div class="control-group">
            <label>辉光强度 <span id="glow-value">1.5</span></label>
            <input type="range" id="glow-intensity" min="0.5" max="3" value="1.5" step="0.1">
        </div>

        <div class="control-group">
            <label>旋转速度 <span id="speed-value">1.0</span></label>
            <input type="range" id="rotation-speed" min="0.1" max="3" value="1" step="0.1">
        </div>
    </div>

    <!-- Bottom left camera window -->
    <div class="camera-window" id="camera-window">
        <div class="camera-header">
            <span>摄像头</span>
            <div class="camera-controls">
                <button class="camera-btn" id="camera-resize-btn" title="调整大小">
                    <svg viewBox="0 0 24 24" width="16" height="16">
                        <path fill="currentColor" d="M4 4h6v6H4V4zm10 0h6v6h-6V4zM4 14h6v6H4v-6zm10 0h6v6h-6v-6z"/>
                    </svg>
                </button>
                <button class="camera-btn" id="camera-close-btn" title="关闭">
                    <svg viewBox="0 0 24 24" width="16" height="16">
                        <path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                    </svg>
                </button>
            </div>
        </div>
        <video id="camera-video" autoplay playsinline></video>
        <div id="hand-status" class="hand-status">等待手势...</div>
    </div>

    <!-- Bottom right fullscreen button -->
    <button class="fullscreen-btn" id="fullscreen-btn" title="全屏">
        <svg viewBox="0 0 24 24" width="24" height="24">
            <path fill="currentColor" d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
        </svg>
    </button>

    <!-- Loading screen -->
    <div class="loading-screen" id="loading-screen">
        <div class="loader">
            <div class="particle-loader"></div>
            <p>正在初始化手势追踪...</p>
        </div>
    </div>

    <!-- MediaPipe Scripts -->
    <script src="https://unpkg.com/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous" onerror="console.error('Failed to load hands.js')"></script>
    <script src="https://unpkg.com/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js" crossorigin="anonymous" onerror="console.error('Failed to load camera_utils.js')"></script>
    <script>
        // Debug: check if MediaPipe loaded
        window.addEventListener('load', () => {
            console.log('Hands available:', typeof window.Hands);
            console.log('Camera available:', typeof window.Camera);
        });
    </script>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
